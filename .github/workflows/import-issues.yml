name: Importar Issues em Massa

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Testar sem criar as issues?'
        type: boolean
        default: true

jobs:
  import-csv-issues:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # A action NÃO cria milestones. Se não existirem, as issues saem sem milestone.
      - name: Criar milestones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r m; do
            gh api "repos/${{ github.repository }}/milestones" -f title="$m" || true
          done <<'EOF'
          01 - Foundation
          02 - Authentication
          03 - Organizations
          04 - Customers
          05 - Deals
          06 - Proposals
          07 - Contracts
          08 - Signatures
          09 - Invoices
          10 - Workflows
          11 - Dashboard
          12 - Notifications & Audit
          13 - Testing
          14 - Production
          EOF

      - name: Importar Issues do CSV
        uses: dsanchezcr/issue-importer-action@v1.0.0
        with:
          file-path: './.github/workflows/flowdesk_github_issues_corrigido.csv'
          file-format: csv
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ inputs.dry_run }}
