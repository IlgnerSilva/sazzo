name: Importar Issues em Massa

on:
  workflow_dispatch: # Permite que você execute o processo manualmente pelo painel do GitHub

jobs:
  import-csv-issues:
    runs-on: ubuntu-latest

    # Dá permissão de escrita para o token criar as issues no repositório
    permissions:
      issues: write
      contents: read

    steps:
      # Passo 1: Baixa o código do repositório (onde está o seu arquivo CSV)
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: Executa a action que lê o CSV e cria as issues
      - name: Importar Issues do CSV
        uses: ginfuru/issue-importer-action@v1.0.0 # Substitua pela versão mais recente/estável se necessário
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          file_path: './issues.csv' # Caminho exato do seu arquivo de dados
